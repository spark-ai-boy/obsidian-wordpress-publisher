<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="WordPress Publisher for Obsidian">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1b33"/>
      <stop offset="0.55" stop-color="#2b1f4d"/>
      <stop offset="1" stop-color="#0f2b3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a88bfa"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="120" fill="#7c5cff" opacity="0.35" filter="url(#blur)"/>
  <circle cx="1120" cy="280" r="110" fill="#4cc9f0" opacity="0.22" filter="url(#blur)"/>
  <g transform="translate(72 76)">
    <rect x="0" y="0" width="112" height="112" rx="24" fill="#ffffff" opacity="0.08"/>
    <path d="M56 20 L88 38 L88 74 L56 92 L24 74 L24 38 Z" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M56 46 L72 55 L72 73 L56 82 L40 73 L40 55 Z" fill="url(#accent)" opacity="0.9"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="216" y="136" fill="#ffffff" font-size="58" font-weight="700" letter-spacing="-1">WordPress Publisher</text>
    <text x="218" y="186" fill="#c9c3e6" font-size="25">Publish Obsidian notes to WordPress — 中文 / English</text>
    <g transform="translate(218 222)">
