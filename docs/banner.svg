      <text x="20" y="24" fill="#a9e7ff" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">posts · media · taxonomy · schedule</text>
    </g>
  </g>
  <g transform="translate(930 140)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="0" y="0" fill="#a88bfa" font-size="22">Obsidian</text>
    <text x="0" y="36" fill="#6f6a8a" font-size="26">──────▶</text>
    <text x="0" y="76" fill="#4cc9f0" font-size="22">WordPress</text>
  </g>
